<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Design at 1200x630 but scale to 0.8 inside a 960x504 clipping stage so the
       1.25 device-pixel-ratio yields an exact 1200x630 PNG with no overflow. */
    html, body { width: 960px; height: 504px; overflow: hidden; }
    .stage { position: relative; width: 960px; height: 504px; overflow: hidden; }
    .banner {
        position: relative;
        width: 1200px;
        height: 630px;
        transform: scale(0.8);
        transform-origin: top left;
        font-family: 'Roboto', sans-serif;
        color: #f4f7fb;
        background:
            radial-gradient(900px 500px at 12% 8%, rgba(18, 184, 134, 0.35), transparent 55%),
            radial-gradient(800px 600px at 90% 95%, rgba(46, 230, 182, 0.28), transparent 55%),
            linear-gradient(160deg, #0b1220 0%, #0f1115 60%, #0a0f14 100%);
        overflow: hidden;
    }
    .grid {
        position: absolute; inset: 0;
        background-image:
            linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
        background-size: 54px 54px;
        -webkit-mask-image: radial-gradient(ellipse 75% 75% at 45% 45%, #000 45%, transparent 100%);
        mask-image: radial-gradient(ellipse 75% 75% at 45% 45%, #000 45%, transparent 100%);
        z-index: 0;
    }
    .watermark-check {
        position: absolute; left: 760px; top: 50%; transform: translateY(-50%) rotate(-8deg);
        width: 420px; height: 420px; color: rgba(46,230,182,0.06); z-index: 1;
    }
    .content { position: absolute; left: 90px; top: 50%; transform: translateY(-50%); z-index: 2; width: 640px; }
    .eyebrow {
        display: inline-flex; align-items: center; gap: 14px;
        font-family: 'Montserrat', sans-serif;
        font-size: 21px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
        color: #2ee6b6;
        padding: 12px 22px;
        border: 1px solid rgba(46,230,182,0.4);
        border-radius: 999px;
        background: rgba(46,230,182,0.08);
        margin-bottom: 32px;
        white-space: nowrap;
    }
    .eyebrow svg { width: 25px; height: 25px; }
    .brand {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700; font-size: 92px; line-height: 1;
        letter-spacing: 3px;
        margin-bottom: 6px;
    }
    .accent-bar {
        width: 150px; height: 8px; border-radius: 8px;
        background: linear-gradient(90deg, #12b886, #2ee6b6);
        margin: 22px 0 30px;
    }
    .tagline {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700; font-size: 42px; color: #ffffff;
        margin-bottom: 14px;
    }
    .subtitle { font-size: 23px; color: rgba(244,247,251,0.75); letter-spacing: 0.3px; }
    .url {
        position: absolute; left: 90px; bottom: 54px; z-index: 3;
        font-family: 'Montserrat', sans-serif; font-weight: 600;
        font-size: 27px; color: #2ee6b6; letter-spacing: 1px;
    }

    /* Checkbox emblem "mixed" with the logo */
    .emblem {
        position: absolute; left: 762px; top: 168px;
        z-index: 2;
        width: 290px; height: 290px;
    }
    .checkbox {
        position: absolute; inset: 0;
        border: 5px solid rgba(46,230,182,0.55);
        border-radius: 46px;
        background: linear-gradient(155deg, rgba(46,230,182,0.16), rgba(18,184,134,0.05));
        box-shadow: 0 24px 60px rgba(46,230,182,0.22), inset 0 0 40px rgba(46,230,182,0.08);
        display: flex; align-items: center; justify-content: center;
    }
    .checkbox img { width: 176px; height: 176px; object-fit: contain; }
    .check-badge {
        position: absolute; top: -24px; right: -24px;
        width: 100px; height: 100px; border-radius: 50%;
        background: linear-gradient(135deg, #12b886, #2ee6b6);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 12px 30px rgba(46,230,182,0.45);
        border: 5px solid #0f1115;
    }
    .check-badge svg { width: 56px; height: 56px; color: #05231a; }
</style>
</head>
<body>
    <div class="stage">
    <div class="banner">
        <div class="grid"></div>
        <svg class="watermark-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12l3 3 5-6"/></svg>

        <div class="content">
            <span class="eyebrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12l3 3 5-6"/></svg>
                Cybersecurity · Consulting
            </span>
            <div class="brand">COMPYRA</div>
            <div class="accent-bar"></div>
            <div class="tagline">IT Security &amp; Consulting</div>
            <div class="subtitle">Penetration Testing · Web Development · IT Consulting</div>
        </div>

        <div class="emblem">
            <div class="checkbox">
                <img src="/WL.png" alt="Compyra logo">
            </div>
            <div class="check-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
        </div>

        <div class="url">compyra.com</div>
    </div>
    </div>
</body>
</html>
