<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabel Logo Galerij</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
        }

        .logo-card {
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .logo-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 30px rgba(255,255,255,0.2);
            border-color: #666666;
        }

        .logo-number {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333333;
            margin-bottom: 12px;
            text-align: center;
        }

        .logo-image-container {
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            border-radius: 8px;
            overflow: hidden;
        }

        .logo-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .logo-card:hover .logo-image {
            transform: scale(1.05);
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            font-size: 0.95rem;
            opacity: 0.85;
        }

        /* Lightbox styles */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .lightbox.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lightbox-content {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 50px;
            color: white;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
            transition: all 0.3s ease;
            line-height: 1;
            user-select: none;
        }

        .lightbox-close:hover {
            color: #cccccc;
            transform: scale(1.1);
        }

        .lightbox-info {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .logo-image-container {
                height: 200px;
            }

            .lightbox-close {
                top: 15px;
                right: 20px;
                font-size: 40px;
            }

            .lightbox-content {
                max-width: 90%;
                max-height: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trabel Logo Galerij</h1>
        <p class="subtitle">Klik op een logo om deze vergroot te bekijken</p>

        <div class="gallery" id="gallery"></div>

        <div class="footer">
            <p>Trabel Logo Ontwerpen - Compyra.com</p>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img class="lightbox-content" id="lightbox-img" onclick="event.stopPropagation()">
        <div class="lightbox-info" id="lightbox-info">Klik buiten de afbeelding of druk ESC om te sluiten</div>
    </div>

    <script>
        // Folders naast gallery.html met demo.png afbeeldingen
        const gallery = document.getElementById('gallery');
        const folders = [8, 18, 22, 25, 32, 33, 41, 45, 47, 48, 50, 51];
        
        folders.forEach(i => {
            const card = document.createElement('div');
            card.className = 'logo-card';
            card.onclick = () => openLightbox(`${i}/demo.png`);
            
            card.innerHTML = `
                <div class="logo-number">Ontwerp #${i}</div>
                <div class="logo-image-container">
                    <img src="${i}/demo.png" alt="Logo Ontwerp ${i}" class="logo-image" onerror="this.parentElement.parentElement.style.display='none'">
                </div>
            `;
            
            gallery.appendChild(card);
        });

        function openLightbox(imageSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = imageSrc;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // Prevent scrolling when lightbox is open
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto'; // Re-enable scrolling
        }

        // Close lightbox on ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
