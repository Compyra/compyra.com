<!DOCTYPE html>
<meta charset="utf-8">
<title>behaviour audit</title>
<pre id="out">RUNNING</pre>
<iframe id="f" style="border:0;height:900px;width:1440px"></iframe>
<script>
    const out = [];
    const f = document.getElementById('f');

    function loadPage(url, width) {
        return new Promise(resolve => {
            f.style.width = width + 'px';
            f.onload = () => setTimeout(() => resolve(f.contentWindow), 350);
            f.src = url;
        });
    }
    const wait = ms => new Promise(r => setTimeout(r, ms));

    function check(name, cond) {
        out.push((cond ? 'PASS ' : 'FAIL ') + name);
    }

    async function run() {
        localStorage.clear();

        // --- typed subtitle completes + reveal fires (home, desktop) --------
        let w = await loadPage('/', 1440);
        await wait(3000);
        let d = w.document;
        check('home: typed subtitle complete',
            d.querySelector('.hero-subtitle').textContent.trim() === 'Professional cybersecurity solutions for businesses');
        check('home: first reveal visible', !!d.querySelector('.reveal.visible'));
        check('home: nav marks current page', d.querySelector('#site-header nav a[aria-current="page"]').getAttribute('href') === '/');

        // --- theme toggle ----------------------------------------------------
        const before = d.documentElement.getAttribute('data-theme');
        d.getElementById('themeToggle').click();
        const after = d.documentElement.getAttribute('data-theme');
        check('home: theme toggle flips (' + before + '->' + after + ')', before !== after && ['dark', 'light'].includes(after));
        check('home: theme persisted', w.localStorage.getItem('theme') === after);
        localStorage.clear();

        // --- language switch (client-side) ------------------------------------
        w = await loadPage('/', 1440);
        d = w.document;
        d.querySelector('.language-btn[data-lang="nl"]').click();
        await wait(2500);
        check('home: NL switch changes h1', d.getElementById('hero-title').textContent.includes('IT Beveiliging'));
        check('home: NL switch changes nav', d.querySelector('#site-header nav a[href="/services/"]').textContent === 'Diensten');
        check('home: NL persisted', w.localStorage.getItem('preferredLanguage') === 'nl');

        // --- language survives page navigation (regression: menu init clobbered it) ---
        w = await loadPage('/services/', 1440);
        await wait(1200);
        d = w.document;
        check('services after NL switch: still NL', d.getElementById('page-title').textContent === 'Diensten');
        check('services after NL switch: storage intact', w.localStorage.getItem('preferredLanguage') === 'nl');
        w = await loadPage('/about/', 1440);
        await wait(1200);
        d = w.document;
        check('about after NL switch: still NL', d.getElementById('page-title').textContent === 'Over Compyra');
        localStorage.clear();

        // --- ?lang= handoff ----------------------------------------------------
        w = await loadPage('/services/?lang=fr', 1200);
        await wait(1200);
        d = w.document;
        check('services?lang=fr: html lang set', d.documentElement.lang === 'fr');
        check('services?lang=fr: query stripped', w.location.search === '');
        check('services?lang=fr: FR heading', d.getElementById('page-title').textContent === 'Services');
        check('services?lang=fr: FR card title', d.body.textContent.includes('Tests de Pénétration'));
        localStorage.clear();

        // --- mobile menu -------------------------------------------------------
        w = await loadPage('/projects/', 390);
        d = w.document;
        d.getElementById('mobileMenuBtn').click();
        await wait(500);
        const overlay = d.getElementById('mobileNav');
        check('mobile menu opens', overlay.classList.contains('active'));
        check('mobile menu has 6 page links', overlay.querySelectorAll('ul a').length === 6);
        check('mobile menu marks current page',
            overlay.querySelector('a[aria-current="page"]') &&
            overlay.querySelector('a[aria-current="page"]').getAttribute('href') === '/projects/');
        const closeBtn = overlay.querySelector('.close-btn');
        closeBtn.click();
        await wait(400);
        check('mobile menu closes', !overlay.classList.contains('active'));

        // --- contact form validation + success ---------------------------------
        w = await loadPage('/contact/', 800);
        d = w.document;
        check('contact: success box hidden initially',
            w.getComputedStyle(d.getElementById('whatsappOption')).display === 'none');
        d.querySelector('#contactForm button[type="submit"]').click();
        await wait(200);
        const err = d.getElementById('formError');
        check('contact: empty submit shows error', !err.hidden && err.textContent.length > 3);
        // fill and submit (stub window.open so no popup)
        w.open = () => null;
        d.getElementById('name').value = 'Test Person';
        d.getElementById('email').value = 'test@example.com';
        d.getElementById('message').value = 'Hello there';
        d.querySelector('#contactForm button[type="submit"]').click();
        await wait(300);
        check('contact: valid submit shows success',
            w.getComputedStyle(d.getElementById('whatsappOption')).display !== 'none');
        check('contact: form hidden after submit',
            w.getComputedStyle(d.getElementById('contactForm')).display === 'none');
        // email copy button exists + mailto button wired
        check('contact: email shown', d.getElementById('emailDisplay').textContent === 'contact@compyra.com');
        localStorage.clear();

        // --- about page: badge count-up target ----------------------------------
        w = await loadPage('/about/', 1200);
        await wait(2500);
        d = w.document;
        const badge = d.getElementById('yearsOfExperience').textContent;
        check('about: experience badge = 12+ (got ' + badge + ')', badge === '12+');
        check('about: timeline has no list numbers',
            w.getComputedStyle(d.querySelector('.timeline')).listStyleType === 'none');

        // --- NL static page: content localized, EN team content present ----------
        w = await loadPage('/nl/certifications/', 1200);
        await wait(800);
        d = w.document;
        check('nl/certifications: localized heading', d.getElementById('page-title').textContent === 'Certificeringen');
        check('nl/certifications: active lang button NL',
            d.querySelector('.language-btn.active').dataset.lang === 'nl');

        // --- support page renders its grid ----------------------------------------
        w = await loadPage('/support/', 1200);
        await wait(800);
        d = w.document;
        check('support: info grid populated', d.getElementById('infoGrid').children.length > 5);

        localStorage.clear();
        document.getElementById('out').textContent = 'DONE\n' + out.join('\n');
    }
    run().catch(e => {
        document.getElementById('out').textContent = 'DONE (crashed: ' + e.message + ')\n' + out.join('\n');
    });
</script>
