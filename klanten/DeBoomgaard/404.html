<!DOCTYPE html>
<html lang="nl-BE">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="/css/style.css">
    <style>
        .error-wrap { min-height: 70vh; display: grid; place-items: center; text-align: center; }
        .error-wrap .big { font-family: var(--font-display); font-size: clamp(4rem, 18vw, 9rem); line-height: 1; color: var(--accent-deep); margin: 0; }
        .error-wrap p { color: var(--text-soft); max-width: 440px; margin: .8rem auto 1.6rem; }

<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/" aria-label="Resto De Boomgaard — startpagina">

                <span class="brand-text">
                    <strong>De Boomgaard</strong>
                    <small>Resto · Oedelem</small>
                </span>
            </a>
        </div>
    </header>

    <main class="section">
        <div class="container error-wrap">
            <div>
                <p class="big">404</p>
                <h1>Deze pagina bestaat niet</h1>

                <a class="btn btn-primary" href="/">Terug naar de startpagina</a>
            </div>
        </div>

</html>
